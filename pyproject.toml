[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dpa"
version = "0.1.0"
description = "Data Product Accelerator — self-service CLI for governed data products on an OSS lakehouse"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
keywords = ["data-engineering", "data-products", "iceberg", "openmetadata", "dagster"]

dependencies = [
    # CLI
    "typer>=0.12.3",
    "rich>=13.7.1",

    # Config / validation
    "pydantic>=2.7.1",
    "pydantic-settings>=2.3.0",
    "pydantic[email]>=2.7.1",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.1",

    # Storage
    "boto3>=1.34.101",
    "botocore>=1.34.101",

    # Iceberg
    "pyiceberg[s3fs,pyarrow]>=0.7.0",

    # Governance (httpx for OpenMetadata REST)
    "httpx>=0.27.0",
    "tenacity>=8.3.0",

    # Template generation
    "jinja2>=3.1.4",

    # Local catalog
    "sqlmodel>=0.0.19",

    # Spark (optional — used by dpa run only)
    "pyspark>=3.5.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "moto[s3]>=5.0.10",
    "respx>=0.21.1",
    "httpx>=0.27.0",
    "ruff>=0.4.4",
    "mypy>=1.10.0",
]

[project.scripts]
dpa = "dpa.main:app"

[tool.hatch.build.targets.wheel]
packages = ["dpa"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires running docker-compose stack",
]
asyncio_mode = "auto"
